name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Select compiler
        run: |
          if [[ "${{ matrix.compiler }}" == "gcc" ]]; then
            echo "CXX=g++" >> "$GITHUB_ENV"
          else
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DTRUST_BEACON_FETCH_CATCH2=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure --output-junit test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.compiler }}-${{ matrix.build_type }}
          path: build/test-results.xml
          if-no-files-found: warn

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lint tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang clang-format clang-tidy
      - name: Check formatting
        run: clang-format --dry-run --Werror include/trust_beacon/*.h src/*.cpp tests/*.cpp
      - name: Configure strict build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_CLANG_TIDY='clang-tidy;-warnings-as-errors=*' -DCMAKE_CXX_FLAGS='-Wall -Wextra -Wpedantic -Werror'
      - name: Build with clang-tidy
        run: cmake --build build

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang
      - name: Configure sanitizers
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTRUST_BEACON_FETCH_CATCH2=ON -DCMAKE_CXX_COMPILER=clang++ -DSANITIZE=address,undefined
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure --output-junit test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-sanitizers
          path: build/test-results.xml
          if-no-files-found: warn
